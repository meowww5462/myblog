<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونتي الخاصة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            color: #333;
            line-height: 1.8;
        }
        #login-screen {
            display: none;
            max-width: 400px; 
            margin: 80px auto; 
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        #login-screen.active { display: block; }
        #login-screen h2 { margin-bottom: 10px; color: #1a1a2e; font-size: 28px; }
        #login-screen p { color: #666; margin-bottom: 25px; }
        #login-screen input {
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 2px solid #e0e0e0;
            border-radius: 10px; 
            font-size: 16px; 
            text-align: center;
            transition: border 0.3s;
        }
        #login-screen input:focus { outline: none; border-color: #1a1a2e; }
        #login-screen button {
            width: 100%;
            background: #1a1a2e; 
            color: #fff; 
            border: none; 
            padding: 14px;
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        #login-screen button:hover { background: #16213e; }
        .error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: block; }
        #blog-screen { display: none; }
        #blog-screen.active { display: block; }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff; 
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 28px; }
        .header .user-info { font-size: 14px; opacity: 0.9; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px; }
        .admin-panel {
            background: #fff; padding: 25px; border-radius: 12px;
            margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .admin-panel h3 { margin-bottom: 20px; color: #1a1a2e; }
        .admin-panel input, .admin-panel textarea {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-family: inherit; font-size: 15px; transition: border 0.3s;
        }
        .admin-panel input:focus, .admin-panel textarea:focus {
            outline: none; border-color: #1a1a2e;
        }
        .admin-panel textarea { min-height: 120px; resize: vertical; }
        .admin-panel label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        .admin-panel .help-text { font-size: 12px; color: #888; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.3s; }
        .btn-primary { background: #1a1a2e; color: #fff; flex: 1; }
        .btn-primary:hover { background: #0f3460; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-outline { background: transparent; border: 2px solid #1a1a2e; color: #1a1a2e; }
        .btn-outline:hover { background: #1a1a2e; color: #fff; }
        .post {
            background: #fff; padding: 25px; margin-bottom: 20px;
            border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: relative; transition: transform 0.2s;
        }
        .post:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .post h2 { color: #1a1a2e; margin-bottom: 8px; font-size: 24px; }
        .post .author { 
            display: inline-block;
            background: #f0f0f0;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        .post .date { color: #888; font-size: 13px; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .post .content { color: #444; line-height: 2; }
        .post .content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0;
            overflow: hidden; margin: 15px 0; border-radius: 8px; background: #000;
        }
        .video-wrapper iframe, .video-wrapper video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; border-radius: 8px;
        }
        .post-actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .post-actions button { padding: 6px 14px; font-size: 13px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #888; }
        .empty-state .icon { font-size: 60px; margin-bottom: 20px; }
        .video-type-selector { display: flex; gap: 15px; margin-bottom: 15px; }
        .video-type-selector label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: normal; }
        .loading { text-align: center; padding: 40px; color: #888; }
        @media (max-width: 600px) {
            .container { padding: 0 15px 30px; }
            .header h1 { font-size: 22px; }
            .post { padding: 18px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="active">
        <h2>🔒</h2>
        <h2>مدونة خاصة</h2>
        <p>أدخل اسمك وكلمة المرور</p>
        <input type="text" id="username-input" placeholder="👤 اسم المستخدم">
        <input type="password" id="password-input" placeholder="🔑 كلمة المرور" onkeydown="if(event.key==='Enter')checkPassword()">
        <button onclick="checkPassword()">🚪 دخول</button>
        <span id="error-msg" class="error"></span>
    </div>

    <div id="blog-screen">
        <div class="header">
            <h1>✍️ مدونتي</h1>
            <span class="user-info">👤 <span id="current-user"></span></span>
        </div>

        <div class="container">
            <div class="admin-panel" id="admin-panel" style="display:none;">
                <h3 id="form-title">📝 مقال جديد</h3>
                <input type="hidden" id="edit-id" value="">
                
                <label>📌 عنوان المقال</label>
                <input type="text" id="post-title" placeholder="ضع عنواناً جذاباً...">
                
                <label>✍️ المحتوى</label>
                <textarea id="post-content" placeholder="اكتب مقالك هنا..."></textarea>
                
                <label>🖼️ رابط الصورة (اختياري)</label>
                <input type="text" id="post-image" placeholder="https://example.com/صورة.jpg">
                <p class="help-text">ارفع صورتك على <a href="https://imgbb.com" target="_blank">imgbb.com</a> ثم الصق الرابط</p>
                
                <label style="margin-top:15px;">🎬 نوع الفيديو</label>
                <div class="video-type-selector">
                    <label><input type="radio" name="video-type" value="direct" checked onchange="toggleVideoInput()"> 🎥 فيديو مباشر</label>
                    <label><input type="radio" name="video-type" value="youtube" onchange="toggleVideoInput()"> ▶️ يوتيوب</label>
                </div>
                
                <div id="direct-video-input">
                    <label>🎥 رابط الفيديو (MP4, WebM)</label>
                    <input type="text" id="post-video-direct" placeholder="https://example.com/فيديو.mp4">
                </div>
                
                <div id="youtube-video-input" style="display:none;">
                    <label>▶️ رابط يوتيوب</label>
                    <input type="text" id="post-video-youtube" placeholder="https://www.youtube.com/watch?v=XXXXXXXX">
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="savePost()">💾 نشر المقال</button>
                    <button class="btn btn-secondary" onclick="cancelEdit()">❌ إلغاء</button>
                </div>
            </div>

            <div style="text-align:center; margin-bottom:25px;">
                <button class="btn btn-outline" onclick="showNewPostForm()" id="new-post-btn">➕ مقال جديد</button>
                <button class="btn btn-danger" onclick="logout()" style="float:left;">🚪 خروج</button>
                <div style="clear:both;"></div>
            </div>

            <div id="posts-container">
                <div class="loading">⏳ جاري تحميل المقالات...</div>
            </div>

            <div class="empty-state" id="empty-state" style="display:none;">
                <div class="icon">📭</div>
                <h3>لا توجد مقالات بعد</h3>
                <p>ابدأ بكتابة أول مقال لك!</p>
            </div>
        </div>
    </div>
    <script>
    // ==================== إعدادات Firebase ====================
    const firebaseConfig = {
        apiKey: "AIzaSyAAzIRj5YFlckjCd9LpS-Pm0UUCFkdxNng",
        authDomain: "myblog-6590f.firebaseapp.com",
        projectId: "myblog-6590f",
        storageBucket: "myblog-6590f.firebasestorage.app",
        messagingSenderId: "230767210257",
        appId: "1:230767210257:web:1bc7b7514552d7177c66b0"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // ==================== الإعدادات ====================
    const SECRET_PASSWORD = "Goodnight113033meow2026tometo";
    
    let posts = [];
    let currentUser = '';

    // ========== التحقق من تسجيل الدخول ==========
    const isLoggedIn = sessionStorage.getItem('blog_auth') === 'true';
    const savedUser = sessionStorage.getItem('blog_user') || '';
    
    if (isLoggedIn && savedUser) {
        currentUser = savedUser;
        showBlog();
    } else {
        showLogin();
    }

    function showLogin() {
        document.getElementById('login-screen').classList.add('active');
        document.getElementById('blog-screen').classList.remove('active');
        document.getElementById('username-input').focus();
    }

    function showBlog() {
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('blog-screen').classList.add('active');
        document.getElementById('current-user').textContent = currentUser;
        loadPosts();
    }

    function checkPassword() {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('error-msg');
        
        if (!username) {
            errorMsg.textContent = '⚠️ الرجاء إدخال اسم المستخدم';
            return;
        }
        
        if (password === SECRET_PASSWORD) {
            currentUser = username;
            sessionStorage.setItem('blog_auth', 'true');
            sessionStorage.setItem('blog_user', username);
            errorMsg.textContent = '';
            showBlog();
        } else {
            errorMsg.textContent = '❌ كلمة المرور غير صحيحة';
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').focus();
        }
    }

    function logout() {
        if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
            sessionStorage.removeItem('blog_auth');
            sessionStorage.removeItem('blog_user');
            document.getElementById('username-input').value = '';
            document.getElementById('password-input').value = '';
            document.getElementById('error-msg').textContent = '';
            hideAdminPanel();
            showLogin();
        }
    }

    // ========== تبديل نوع الفيديو ==========
    function toggleVideoInput() {
        const videoType = document.querySelector('input[name="video-type"]:checked').value;
        document.getElementById('direct-video-input').style.display = videoType === 'direct' ? 'block' : 'none';
        document.getElementById('youtube-video-input').style.display = videoType === 'youtube' ? 'block' : 'none';
    }

    // ========== تحميل المقالات من Firestore ==========
    async function loadPosts() {
        const container = document.getElementById('posts-container');
        container.innerHTML = '<div class="loading">⏳ جاري تحميل المقالات...</div>';
        
        try {
            const snapshot = await db.collection('posts').orderBy('date', 'desc').get();
            posts = [];
            snapshot.forEach(doc => {
                posts.push({ id: doc.id, ...doc.data() });
            });
            renderPosts();
        } catch (error) {
            console.error('خطأ:', error);
            container.innerHTML = '<div class="loading">❌ حدث خطأ. تأكد من تفعيل Firestore في وضع الاختبار.</div>';
        }
    }

    // ========== لوحة التحكم ==========
    function showNewPostForm() {
        document.getElementById('form-title').textContent = '📝 مقال جديد';
        document.getElementById('edit-id').value = '';
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-image').value = '';
        document.getElementById('post-video-direct').value = '';
        document.getElementById('post-video-youtube').value = '';
        document.querySelector('input[name="video-type"][value="direct"]').checked = true;
        toggleVideoInput();
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('new-post-btn').style.display = 'none';
        document.getElementById('post-title').focus();
        document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function editPost(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        
        document.getElementById('form-title').textContent = '✏️ تعديل المقال';
        document.getElementById('edit-id').value = postId;
        document.getElementById('post-title').value = post.title;
        document.getElementById('post-content').value = post.content;
        document.getElementById('post-image').value = post.image || '';
        
        if (post.videoType === 'youtube') {
            document.querySelector('input[name="video-type"][value="youtube"]').checked = true;
            document.getElementById('post-video-youtube').value = post.video || '';
            document.getElementById('post-video-direct').value = '';
        } else {
            document.querySelector('input[name="video-type"][value="direct"]').checked = true;
            document.getElementById('post-video-direct').value = post.video || '';
            document.getElementById('post-video-youtube').value = '';
        }
        toggleVideoInput();
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('new-post-btn').style.display = 'none';
        document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() { hideAdminPanel(); }

    function hideAdminPanel() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('new-post-btn').style.display = 'inline-block';
        document.getElementById('edit-id').value = '';
    }

    async function savePost() {
        const title = document.getElementById('post-title').value.trim();
        const content = document.getElementById('post-content').value.trim();
        const image = document.getElementById('post-image').value.trim();
        const editId = document.getElementById('edit-id').value;
        const videoType = document.querySelector('input[name="video-type"]:checked').value;
        let video = '';
        if (videoType === 'direct') { video = document.getElementById('post-video-direct').value.trim(); }
        else { video = document.getElementById('post-video-youtube').value.trim(); }
        
        if (!title) { alert('⚠️ الرجاء إدخال عنوان المقال'); return; }
        if (!content) { alert('⚠️ الرجاء إدخال محتوى المقال'); return; }

        const postData = {
            title: title,
            content: content,
            image: image,
            video: video,
            videoType: videoType,
            author: currentUser,
            date: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            if (editId) {
                await db.collection('posts').doc(editId).update(postData);
            } else {
                await db.collection('posts').add(postData);
            }
            hideAdminPanel();
            loadPosts();
        } catch (error) {
            console.error('خطأ:', error);
            alert('❌ حدث خطأ. تأكد من تفعيل Firestore.');
        }
    }

    async function deletePost(postId) {
        if (confirm('🗑️ هل أنت متأكد من حذف هذا المقال؟')) {
            try {
                await db.collection('posts').doc(postId).delete();
                loadPosts();
            } catch (error) {
                console.error('خطأ:', error);
                alert('❌ حدث خطأ في الحذف.');
            }
        }
    }
               // ========== عرض المقالات ==========
        function renderPosts() {
            const container = document.getElementById('posts-container');
            const emptyState = document.getElementById('empty-state');

            if (posts.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            
            container.innerHTML = posts.map(post => {
                let imageHTML = '';
                if (post.image) { imageHTML = `<img src="${escapeHTML(post.image)}" alt="صورة" loading="lazy" onerror="this.style.display='none'">`; }
                
                let videoHTML = '';
                if (post.video) {
                    if (post.videoType === 'youtube') {
                        const videoId = extractYouTubeID(post.video);
                        if (videoId) { videoHTML = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`; }
                        else { videoHTML = `<p>🎬 <a href="${escapeHTML(post.video)}" target="_blank">رابط الفيديو</a></p>`; }
                    } else {
                        const isVideoFile = /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(post.video);
                        if (isVideoFile || post.video.includes('video')) { videoHTML = `<div class="video-wrapper"><video controls preload="metadata" playsinline><source src="${escapeHTML(post.video)}" type="video/mp4"></video></div>`; }
                        else { videoHTML = `<p>🎬 <a href="${escapeHTML(post.video)}" target="_blank">مشاهدة الفيديو</a></p>`; }
                    }
                }
                
                let dateText = '';
                if (post.date && post.date.toDate) {
                    dateText = post.date.toDate().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                } else {
                    dateText = 'قبل قليل';
                }
                
                let contentHTML = escapeHTML(post.content).replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
                
                return `<div class="post">
                    <h2>${escapeHTML(post.title)}</h2>
                    <span class="author">👤 ${escapeHTML(post.author || 'مجهول')}</span>
                    <div class="date">📅 ${dateText}</div>
                    ${imageHTML}
                    ${videoHTML}
                    <div class="content">${contentHTML}</div>
                    <div class="post-actions">
                        <button class="btn btn-outline" onclick="editPost('${post.id}')">✏️ تعديل</button>
                        <button class="btn btn-danger" onclick="deletePost('${post.id}')">🗑️ حذف</button>
                    </div>
                </div>`;
            }).join('');
        }

        function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        function extractYouTubeID(url) {
            const patterns = [/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\s?#]+)/, /youtube\.com\/shorts\/([^&\s?#]+)/];
            for (const pattern of patterns) { const match = url.match(pattern); if (match) return match[1]; }
            return null;
        }
    </script>
</body>
</html>
